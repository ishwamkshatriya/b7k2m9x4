[project]
name = "windintel"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "tzdata>=2024.1",
]

[tool.vercel]
entrypoint = "index:app"

[tool.vercel.scripts]
build = "python scripts/vercel_build.py"

[tool.vercel.fastapi.static]
cdn = true